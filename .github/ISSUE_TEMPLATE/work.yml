name: 작업 제안
description: 기능 개선 또는 오류 수정 범위를 공유합니다.
title: "[작업] "
body:
  - type: textarea
    id: purpose
    attributes:
      label: 목적과 현재 문제
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위와 제외할 내용
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 확인 기준
    validations:
      required: true
  - type: input
    id: sonjapgo
    attributes:
      label: 연결된 손잡고 작업 주소
      description: 이미 등록된 작업이 있는 경우에만 적습니다.
